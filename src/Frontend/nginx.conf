# Serves the production build of the frontend and proxies /api to the backend, so the browser
# only ever talks to one address.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's built-in DNS: nginx looks "backend" up per request, so it starts even if the
    # backend is not ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        # $http_host keeps the port in a local rehearsal. No X-Forwarded-Proto line: the platform
        # edge already sends X-Forwarded-Proto/Host/Port and nginx passes them on unchanged.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 55s;
    }

    # Client-side routes (React Router) fall back to index.html on a page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
