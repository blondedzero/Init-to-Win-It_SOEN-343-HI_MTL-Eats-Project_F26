spring:
  application:
    name: ShopEasy

  config:
    import: file:.env[.properties]

  datasource:
    url: jdbc:postgresql://ep-crimson-queen-b52hm9j1-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      max-lifetime: 240000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  server:
    port: 8080

